{% extends "play.html" %}
{% block extra %}
<canvas id="steppe" width="320" height="180"></canvas>
<script>
// the steppe: a 320 px wide pixel canvas stretched over the viewport, a deep blue sky, a bank of cumulus along the horizon, a bright meadow with pale patches and tall grass bent by gusts running left to right
const cv = document.getElementById('steppe'), sc = cv.getContext('2d'), W = 320;
let H = 180, horizon = 100, blades = [], patches = [], seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SKY = ['#143a86', '#194496', '#1f50a8', '#275eb8', '#316ec7', '#3f80d3', '#5093dc', '#66a6e4', '#7fb8ec'];
const NEAR = ['#4b8c28', '#5a9c30', '#6bab38', '#7dba41', '#93c94a'], FAR = ['#a6d34c', '#b9dc5b', '#8fc541'];
const CLOUDS = Array.from({length: 18}, (_, i) => ({x: i * (W + 90) / 18 + rnd() * 24, y: 0.7 + rnd() * 0.26, v: 0.5 + rnd() * 1.3, puffs: Array.from({length: 10}, () => [rnd() * 64 - 32, rnd() * 12 - 8, 6 + rnd() * 13])}));
const size = () => {
  H = Math.max(150, Math.round(W * innerHeight / innerWidth));
  cv.width = W; cv.height = H;
  horizon = Math.round(H * 0.56);
  const field = H - horizon, k = H / 180;
  seed = 11;
  patches = Array.from({length: 14}, () => [rnd() * W, horizon + 4 + rnd() * field * 0.45, 14 + rnd() * 40, 2 + rnd() * 4]);
  blades = [];
  for (let i = 0; i < 260; i++) blades.push({x: rnd() * W, y: horizon + 3 + rnd() * field * 0.5, h: 3 + rnd() * 7, c: i % 3 ? FAR[i % 3] : NEAR[4], p: rnd() * 6, wide: 0});
  for (let i = 0; i < 520; i++) blades.push({x: rnd() * W, y: H - field * 0.42 + rnd() * (field * 0.42 + 4), h: (14 + rnd() * 22) * k, c: NEAR[i % 5], p: rnd() * 6, wide: 1});
  blades.sort((a, b) => a.y - b.y);
};
// a slow ripple, a fast ripple, a strong gust wave travelling right and a steady lean, so most blades sweep far to the right
const wind = (x, t) => 0.6 * Math.sin(x / 16 - t * 2.6) + 0.35 * Math.sin(x / 6 + t * 3.5) + 2.6 * Math.max(0, Math.sin(x / 55 - t * 1.3)) ** 2 + 0.7;
const draw = t => {
  const band = horizon / SKY.length;
  SKY.forEach((c, i) => { sc.fillStyle = c; sc.fillRect(0, Math.round(band * i), W, Math.ceil(band) + 1); });
  for (const cl of CLOUDS) {
    const cx = ((cl.x + cl.v * t) % (W + 90)) - 45, cy = cl.y * horizon;
    for (const [colour, dy] of [['#8db7e6', 4], ['#c9dff5', 2], ['#f7fafe', 0]]) {
      sc.fillStyle = colour;
      for (const [dx, py, r] of cl.puffs) { sc.beginPath(); sc.arc(Math.round(cx + dx), Math.round(cy + py + dy), r, 0, 7); sc.fill(); }
    }
  }
  for (let x = 0; x < W; x++) { const y = horizon - Math.round(2 + 2 * Math.sin(x / 60) + Math.sin(x / 17)); sc.fillStyle = '#a2d048'; sc.fillRect(x, y, 1, H - y); }
  sc.fillStyle = '#8bc23f'; sc.fillRect(0, horizon + (H - horizon) * 0.3, W, H);
  sc.fillStyle = '#6aa634'; sc.fillRect(0, horizon + (H - horizon) * 0.62, W, H);
  sc.fillStyle = '#c7db66';
  for (const [x, y, rx, ry] of patches) { sc.beginPath(); sc.ellipse(x, y, rx, ry, 0, 0, 7); sc.fill(); }
  for (const b of blades) {
    const bend = Math.min(b.h * 0.95, wind(b.x + b.p * 9, t) * b.h * 0.34);
    sc.fillStyle = b.c;
    for (let k = 0; k < b.h; k++) sc.fillRect(Math.round(b.x + bend * (k / b.h) ** 1.7), Math.round(b.y - k), b.wide && k < b.h * 0.55 ? 2 : 1, 1);
    if (b.wide) { sc.fillStyle = '#c8e070'; sc.fillRect(Math.round(b.x + bend), Math.round(b.y - b.h), 1, 1); }
  }
};
let start = 0;
const frame = ms => { draw((ms - start) / 1000); requestAnimationFrame(frame); };
size();
addEventListener('resize', size);
if (still) draw(0); else requestAnimationFrame(ms => { start = ms; frame(ms); });
</script>
{% endblock %}
